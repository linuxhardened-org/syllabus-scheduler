# Smart Study Planner - Docker Compose Configuration
# 4-Service Architecture: Frontend, Backend, MongoDB, Ollama AI

services:
  # ===========================================
  # DATABASE SERVICE - MongoDB
  # ===========================================
  planner-mongo:
    image: mongo:6.0
    container_name: planner-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    environment:
      MONGO_INITDB_DATABASE: study_planner
    networks:
      - planner-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # AI SERVICE - Ollama (Local LLM)
  # ===========================================
  planner-ai:
    image: ollama/ollama:latest
    container_name: planner-ai
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - planner-network
    deploy:
      resources:
        reservations:
          memory: 8G
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1" ]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 120s

  # ===========================================
  # BACKEND SERVICE - Node.js + Express API
  # ===========================================
  planner-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: planner-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://planner-mongo:27017/study_planner
      OLLAMA_HOST: http://planner-ai:11434
      OLLAMA_MODEL: llama3.1
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - planner-network
    depends_on:
      planner-mongo:
        condition: service_healthy
      planner-ai:
        condition: service_started
    command: npm run dev

  # ===========================================
  # FRONTEND SERVICE - React + Vite
  # ===========================================
  planner-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: planner-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - planner-network
    depends_on:
      - planner-backend
    command: npm run dev -- --host 0.0.0.0

# ===========================================
# NETWORKS
# ===========================================
networks:
  planner-network:
    driver: bridge

# ===========================================
# VOLUMES (Persistent Storage)
# ===========================================
volumes:
  mongo_data:
    driver: local
  ollama_data:
    driver: local
